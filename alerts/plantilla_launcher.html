<!DOCTYPE html>
<!--
  Página "launcher" — se abre con UN tap desde el botón de Telegram, y ella
  misma abre una pestaña por cada casa involucrada en el arbitraje.

  No toca ninguna cuenta ni plataforma de apuestas: solo abre pestañas del
  navegador con los links directos.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arbitraje listo</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 20px;
  }
  h1 { font-size: 20px; }
  .resumen { background: #1c1c1c; padding: 14px; border-radius: 10px; margin-bottom: 16px; }
  .casa {
    background: #1c1c1c;
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .stake {
    font-family: monospace;
    font-size: 18px;
    background: #2a2a2a;
    padding: 6px 10px;
    border-radius: 6px;
  }
  button {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    background: #2e7d32;
    color: white;
    margin-top: 10px;
  }
  button:active { background: #1b5e20; }
  .copiado { color: #66bb6a; font-size: 13px; margin-top: 4px; display: none; }
</style>
</head>
<body>

<h1>⚡ Ejecución {{EJECUCION}}</h1>
<div class="resumen">
  ROI: {{ROI}}% · Beneficio: {{BENEFICIO}}<br>
  🏟 {{PARTIDO}}
</div>

<div id="casas"><!-- se llena con JS a partir de CASAS_JSON --></div>

<button onclick="abrirTodas()">🚀 Abrir todas las casas</button>

<script>
  const CASAS = {{CASAS_JSON}};

  const cont = document.getElementById('casas');
  CASAS.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'casa';
    div.innerHTML = `
      <div>
        <strong>${i + 1}️⃣ ${c.nombre}</strong><br>
        <small>${c.seleccion} · cuota ${c.cuota}</small><br>
        <span class="stake" onclick="copiarStake('${c.stake}', this)">${c.stake} 📋</span>
        <div class="copiado">¡Copiado!</div>
      </div>
    `;
    cont.appendChild(div);
  });

  function copiarStake(valor, el) {
    navigator.clipboard.writeText(valor);
    const aviso = el.parentElement.querySelector('.copiado');
    aviso.style.display = 'block';
    setTimeout(() => aviso.style.display = 'none', 1200);
  }

  function abrirTodas() {
    CASAS.forEach(c => window.open(c.link, '_blank'));
  }
</script>

</body>
</html>
