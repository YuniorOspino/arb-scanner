<!DOCTYPE html>
<!--
  Página "launcher" — un tap desde Telegram abre esta página;
  desde aquí se abren las casas y se copia el stake.

  No toca cuentas ni plataformas: solo links + portapapeles.
-->
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0e0e10">
<title>Arbitraje listo</title>
<style>
  :root {
    --bg: #0e0e10;
    --card: #17171a;
    --text: #f2f2f2;
    --muted: #9a9aa3;
    --accent: #3d8bfd;
    --green: #2e7d32;
    --green-press: #1b5e20;
    --stake: #1e3a8a;
    --stake-press: #1e40af;
    --bet: #fff3bf;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 12px 14px calc(28px + var(--safe-b));
    line-height: 1.3;
    max-width: 560px;
    margin-inline: auto;
  }

  .topbar {
    margin-bottom: 10px;
  }
  .topbar h1 {
    font-size: 15px;
    margin: 0 0 4px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 0.02em;
  }
  .resumen {
    background: var(--card);
    padding: 12px 14px;
    border-radius: 12px;
    margin-bottom: 12px;
    border: 1px solid #2a2a30;
  }
  .resumen .meta {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 4px;
  }
  .resumen .partido {
    font-size: 16px;
    font-weight: 700;
  }
  .orden-hint {
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }

  button.abrir {
    display: block;
    width: 100%;
    min-height: 56px;
    padding: 16px 14px;
    font-size: 18px;
    font-weight: 800;
    border: none;
    border-radius: 14px;
    background: var(--green);
    color: #fff;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    margin: 0 0 14px;
    letter-spacing: 0.01em;
  }
  button.abrir:active { background: var(--green-press); }
  button.abrir.abajo {
    margin-top: 8px;
    margin-bottom: calc(8px + var(--safe-b));
  }

  .casa {
    background: var(--card);
    border-radius: 16px;
    margin-bottom: 16px;
    overflow: hidden;
    border: 1px solid #2a2a30;
    border-top: 5px solid #3d8bfd;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .casa:nth-child(even) { border-top-color: #f0a202; }
  .casa.primero { box-shadow: 0 0 0 2px rgba(61, 139, 253, 0.35); }

  .casa-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px 6px;
  }
  .casa-num {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 18px;
    font-weight: 900;
    background: #1a2740;
    color: #7eb6ff;
  }
  .casa:nth-child(even) .casa-num {
    background: #2a220e;
    color: #f0a202;
  }
  .casa-nombre {
    font-size: 20px;
    font-weight: 800;
    flex: 1;
    min-width: 0;
  }
  .casa-badge {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: #7eb6ff;
    background: #132238;
    padding: 5px 8px;
    border-radius: 8px;
  }
  .casa:nth-child(even) .casa-badge {
    color: #f0c14d;
    background: #2a220e;
  }

  /* Qué apostar = hero de cada card */
  .apostar {
    margin: 6px 14px 12px;
    padding: 14px 14px 12px;
    background: #101820;
    border: 1px solid #3d5a80;
    border-radius: 12px;
  }
  .apostar .label {
    display: block;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7eb6ff;
    margin-bottom: 6px;
  }
  .apostar .seleccion {
    font-size: clamp(22px, 6.2vw, 28px);
    font-weight: 900;
    line-height: 1.15;
    color: var(--bet);
    letter-spacing: -0.01em;
    word-break: break-word;
  }
  .apostar .mercado {
    margin-top: 8px;
    font-size: 13px;
    font-weight: 600;
    color: #a8c4e8;
  }
  .apostar .cuota {
    margin-top: 4px;
    font-size: 15px;
    font-weight: 800;
    color: #ffd27a;
    font-variant-numeric: tabular-nums;
  }

  .acciones {
    padding: 0 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  button.copiar-stake {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 58px;
    padding: 14px 16px;
    border: none;
    border-radius: 12px;
    background: var(--stake);
    color: #fff;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.15s ease;
  }
  button.copiar-stake:active { background: var(--stake-press); }
  button.copiar-stake.copied {
    background: #1b5e20;
  }
  .copiar-stake .izq {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
    min-width: 0;
  }
  .copiar-stake .lbl {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.85;
  }
  .copiar-stake .stake-val {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 24px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .copiar-stake .der {
    flex-shrink: 0;
    font-size: 14px;
    font-weight: 800;
    opacity: 0.95;
  }
  .copiado {
    color: #66bb6a;
    font-size: 13px;
    font-weight: 700;
    min-height: 1.1em;
    opacity: 0;
    transition: opacity 0.15s ease;
    pointer-events: none;
    margin-top: -4px;
  }
  .copiado.visible { opacity: 1; }

  a.abrir-casa {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 48px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #3a3a44;
    background: #222228;
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
    font-weight: 800;
    -webkit-tap-highlight-color: transparent;
  }
  a.abrir-casa:active { background: #2c2c34; }
  a.abrir-casa.disabled {
    opacity: 0.45;
    pointer-events: none;
  }

  #popup-aviso {
    display: none;
    margin: 0 0 12px;
    padding: 12px 14px;
    border-radius: 10px;
    background: #3b1d1d;
    border: 1px solid #f87171;
    color: #fecaca;
    font-size: 14px;
    line-height: 1.4;
    font-weight: 600;
  }
  #popup-aviso.visible { display: block; }

  @media (min-width: 480px) {
    body { padding: 18px 18px 32px; }
    .apostar .seleccion { font-size: 28px; }
    button.copiar-stake { min-height: 62px; }
    button.copiar-stake .stake-val { font-size: 26px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Ejecución {{EJECUCION}}</h1>
</div>

<div class="resumen">
  <div class="meta">ROI {{ROI}}% · Beneficio {{BENEFICIO}}</div>
  <div class="partido">{{PARTIDO}}</div>
</div>

<button type="button" class="abrir" id="abrir-arriba" onclick="abrirTodas()">
  Abrir todas las casas
</button>

<div id="popup-aviso" role="alert"></div>

<p class="orden-hint">Orden: mayor stake primero · Copiá → abrí → confirmá</p>

<div id="casas"></div>

<button type="button" class="abrir abajo" id="abrir-abajo" onclick="abrirTodas()">
  Abrir todas las casas
</button>

<script>
  const CASAS_RAW = {{CASAS_JSON}};
  const OPEN_DELAY_MS = 350;

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function stakeNum(c) {
    const n = Number(c && c.stake);
    return Number.isFinite(n) ? n : 0;
  }

  // 1) Mayor stake primero (misma prioridad al abrir pestañas).
  const CASAS = [...CASAS_RAW].sort((a, b) => stakeNum(b) - stakeNum(a));

  function fmtStake(v) {
    const n = Number(v);
    if (!Number.isFinite(n)) return String(v ?? "");
    try {
      return n.toLocaleString("es-CO", { maximumFractionDigits: 0 });
    } catch (_) {
      return String(Math.round(n));
    }
  }

  function mostrarAvisoPopup(msg) {
    const el = document.getElementById("popup-aviso");
    if (!el) {
      alert(msg);
      return;
    }
    el.textContent = msg;
    el.classList.add("visible");
  }

  function ocultarAvisoPopup() {
    const el = document.getElementById("popup-aviso");
    if (el) {
      el.textContent = "";
      el.classList.remove("visible");
    }
  }

  const cont = document.getElementById("casas");
  CASAS.forEach((c, i) => {
    const mercado = c.mercado || c.market || c.market_type || "Mercado";
    const seleccion = c.seleccion || "—";
    const link = c.link || "";
    const stakeRaw = String(c.stake ?? "").trim();
    const stakeShown = fmtStake(c.stake);
    const cuota = c.cuota != null && c.cuota !== "" ? Number(c.cuota).toFixed(2) : "—";
    const div = document.createElement("div");
    div.className = "casa" + (i === 0 ? " primero" : "");
    div.innerHTML = `
      <div class="casa-head">
        <div class="casa-num">${i + 1}</div>
        <div class="casa-nombre">${esc(c.nombre)}</div>
        ${i === 0 ? '<span class="casa-badge">Mayor stake</span>' : ""}
      </div>
      <div class="apostar">
        <span class="label">Apostar exactamente</span>
        <div class="seleccion">${esc(seleccion)}</div>
        <div class="mercado">${esc(mercado)}</div>
        <div class="cuota">Cuota ${esc(cuota)}</div>
      </div>
      <div class="acciones">
        <button type="button" class="copiar-stake" data-stake="${esc(stakeRaw)}"
          aria-label="Copiar stake ${esc(stakeShown)}">
          <span class="izq">
            <span class="lbl">Copiar stake</span>
            <span class="stake-val">${esc(stakeShown)}</span>
          </span>
          <span class="der">📋 Copiar</span>
        </button>
        <div class="copiado" aria-live="polite">Stake copiado</div>
        <a class="abrir-casa${link ? "" : " disabled"}"
           href="${link ? esc(link) : "#"}"
           target="_blank" rel="noopener noreferrer"
           ${link ? "" : 'aria-disabled="true"'}>
          Abrir ${esc(c.nombre || "casa")}
        </a>
      </div>
    `;
    cont.appendChild(div);
  });

  cont.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".copiar-stake");
    if (!btn || !cont.contains(btn)) return;
    copiarStake(btn.dataset.stake || "", btn);
  });

  function mostrarStakeCopiado(btn) {
    const wrap = btn.closest(".acciones");
    const aviso = wrap && wrap.querySelector(".copiado");
    btn.classList.add("copied");
    const der = btn.querySelector(".der");
    if (der) der.textContent = "✓ Listo";
    if (aviso) aviso.classList.add("visible");
    clearTimeout(btn._copyTimer);
    btn._copyTimer = setTimeout(() => {
      btn.classList.remove("copied");
      if (der) der.textContent = "📋 Copiar";
      if (aviso) aviso.classList.remove("visible");
    }, 1400);
  }

  function copiarStake(valor, el) {
    const texto = String(valor ?? "").trim();
    if (!texto) return;

    const ok = () => mostrarStakeCopiado(el);
    const fail = () => {
      try {
        const ta = document.createElement("textarea");
        ta.value = texto;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        ok();
      } catch (_) {
        /* clipboard unavailable */
      }
    };

    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(texto).then(ok).catch(fail);
    } else {
      fail();
    }
  }

  function abrirTodas() {
    ocultarAvisoPopup();
    const conLink = CASAS.filter((c) => c && c.link);
    if (!conLink.length) {
      mostrarAvisoPopup("No hay links de casas para abrir en esta alerta.");
      return;
    }

    let bloqueadas = 0;
    conLink.forEach((c, i) => {
      setTimeout(() => {
        const win = window.open(c.link, "_blank", "noopener,noreferrer");
        if (!win || win.closed) bloqueadas += 1;
        if (i === conLink.length - 1 && bloqueadas > 0) {
          mostrarAvisoPopup(
            "El navegador bloqueó " +
              bloqueadas +
              " pestaña(s). Usá «Abrir [casa]» en cada tarjeta, o permite pop-ups y volvé a intentar."
          );
        }
      }, i * OPEN_DELAY_MS);
    });
  }
</script>

</body>
</html>
